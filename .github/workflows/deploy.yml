name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'passwords.enc.json'
  repository_dispatch:
    types:
      - trpg-logs-updated

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-retry"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout TRPG logs
        uses: actions/checkout@v4
        with:
          repository: flosnidor9/Trpg-Logs
          path: trpg-logs
          ssh-key: ${{ secrets.TRPG_LOGS_DEPLOY_KEY }}
          persist-credentials: false

      - name: Copy TRPG logs
        run: |
          rm -rf public/images/afterTheRoll
          rm -rf public/images/characters
          mkdir -p public/images
          cp -R trpg-logs/public/images/afterTheRoll public/images/afterTheRoll
          if [ -d trpg-logs/public/images/characters ]; then cp -R trpg-logs/public/images/characters public/images/characters; fi
          if [ -f trpg-logs/public/characters/characters.json ]; then node scripts/prepare-characters.mjs trpg-logs/public/characters/characters.json src/content/characters.json; fi
          if [ -d trpg-logs/public/images/gallery ]; then cp -R trpg-logs/public/images/gallery public/images/gallery; fi
          if [ -f trpg-logs/public/gallery/gallery.json ]; then cp trpg-logs/public/gallery/gallery.json src/content/gallery.json; fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /AfterTheRoll
          NEXT_PUBLIC_SITE_URL: https://flosnidor9.github.io/AfterTheRoll/
          NEXT_PUBLIC_GOOGLE_CALENDAR_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_CALENDAR_API_KEY }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          TRPG_MASTER_KEY: ${{ secrets.TRPG_MASTER_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
